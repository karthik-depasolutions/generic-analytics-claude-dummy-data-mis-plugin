version: 0.2.0.dev0
semantic_model:
- name: generic-analytics-claude-dummy-data-mis-plugin
  description: This database primarily logs the execution states and events of AI
    agent runs. The core entities are 'checkpoints', which represent specific states
    of an agent run, and 'checkpoint_writes' and 'checkpoint_blobs', which detail
    the data written to various channels during these runs. While no explicit relationships
    were detected, tables share common identifiers like 'thread_id' and 'checkpoint_id',
    suggesting implicit connections for tracking an agent's progression. 'checkpoint_migrations'
    tracks schema versions for the checkpointing system itself.
  datasets:
  - name: '["generic-analytics-claude-dummy-data-mis-plugin","checkpoint_blobs"]'
    source: '"public"."checkpoint_blobs"'
    description: One row represents a specific checkpoint blob, storing the state
      of an AI agent run at a particular version and channel.
    ai_context:
      synonyms:
      - AI agent run checkpoints
      - agent state logs
      - workflow checkpoints
      instructions: one row per instance of a checkpoint blob for a specific AI agent
        run, version, and channel (no unique key found across all columns)
    fields:
    - name: thread_id
      description: A unique identifier for a specific AI agent run or thread.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"thread_id"'
      ai_context:
        synonyms:
        - agent run ID
        - run identifier
        - session ID
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "high", "enum": null}'
    - name: checkpoint_ns
      description: The namespace associated with this checkpoint, which is currently
        always empty.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"checkpoint_ns"'
      ai_context:
        synonyms:
        - checkpoint namespace
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "low", "enum": {"": "default or unspecified namespace"}}'
    - name: channel
      description: The specific communication channel or component within the AI agent
        run that this checkpoint relates to.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"channel"'
      ai_context:
        synonyms:
        - communication channel
        - component
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "medium", "enum": {"__pregel_tasks": "Internal channel
          for Pregel-like tasks", "__start__": "Initial state or start of the agent
          run", "messages": "Channel for agent messages or interactions"}}'
    - name: version
      description: A version or sequence number indicating the progression of the
        checkpoint within the AI agent run.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"version"'
      ai_context:
        synonyms:
        - checkpoint version
        - state version
        - sequence number
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "high", "enum": null}'
    - name: type
      description: The data format or encoding used for the stored blob content.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"type"'
      ai_context:
        synonyms:
        - data format
        - encoding type
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "medium", "enum": {"msgpack": "MessagePack serialization
          format"}}'
    - name: blob
      description: Free-form text.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"blob"'
      ai_context:
        synonyms: []
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "low", "enum": null}'
    custom_extensions:
    - vendor_name: FORGE
      data: '{"role": "log"}'
  - name: '["generic-analytics-claude-dummy-data-mis-plugin","checkpoint_migrations"]'
